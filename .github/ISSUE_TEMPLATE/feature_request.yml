name: Feature Request
description: Suggest an idea or enhancement for skat-os
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature or improvement for **skat-os**!
        Please review [existing issues](https://github.com/theon199/skat-os/issues) and [discussions](https://github.com/theon199/skat-os/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: "I am always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear and concise description of what you want to happen.
      placeholder: "Describe the proposed workflow, keyboard shortcut, Markdown syntax, or TUI enhancement..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other workarounds or alternative approaches have you tried or considered?
      placeholder: "e.g., Using external CLI scripts or alternative terminal tools..."

  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which part of skat-os is most relevant to this proposal?
      options:
        - "Interactive Runbooks & PTY Runner"
        - "Editor & Markdown Document Canvas"
        - "Zero-Cloud Multiplayer Peer-to-Peer"
        - "Mesh Fleet & Remote SSH Execution"
        - "Security Vault (ChaCha20) & Heuristic Guardrails"
        - "Audit Trail & Cryptographic Hash Chain"
        - "TUI Layout, Themes, & Command Palette"
        - "CLI Flags & Automation Scripts"
        - "Documentation & Examples"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, terminal UI ASCII mockups, or runbook examples here.
