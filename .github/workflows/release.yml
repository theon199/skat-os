name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_type: tar.gz
            binary_name: skat-os
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_type: zip
            binary_name: skat-os.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux aarch64)
        if: matrix.use_cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Release Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          ARCHIVE_NAME="skat-os-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          chmod +x "dist/${{ matrix.binary_name }}"
          (cd dist && tar -czf "../${ARCHIVE_NAME}" "${{ matrix.binary_name }}")
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          mkdir -p artifacts
          mv "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" artifacts/
        shell: bash

      - name: Package Release Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $ArchiveName = "skat-os-$Tag-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination dist/
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "$ArchiveName.sha256" -Encoding ascii
          New-Item -ItemType Directory -Force -Path artifacts
          Move-Item $ArchiveName, "$ArchiveName.sha256" -Destination artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          echo "=== Generated SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
