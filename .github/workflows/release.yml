name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            archive_type: tar.gz
            binary_name: skat-os
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            archive_type: tar.gz
            binary_name: skat-os
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            archive_type: zip
            binary_name: skat-os.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux aarch64)
        if: matrix.use_cross
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin

      # The Windows build step uses Git Bash, whose /usr/bin/perl shadows the
      # runner's Strawberry Perl. OpenSSL's Configure then fails looking for
      # Locale::Maketext::Simple. Pin perl via OPENSSL_SRC_PERL, and install
      # NASM so openssl-src can enable assembly instead of passing no-asm.
      - name: Prepare vendored OpenSSL build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path $perl)) {
            choco install strawberryperl --no-progress -y
            if ($LASTEXITCODE -eq 3010) { $global:LASTEXITCODE = 0 }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $perl)) {
            throw "Strawberry Perl was not found at $perl"
          }
          & $perl -MLocale::Maketext::Simple -e "exit 0"
          "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> $env:GITHUB_ENV

          choco install nasm --no-progress -y
          if ($LASTEXITCODE -eq 3010) { $global:LASTEXITCODE = 0 }
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "NASM install failed (exit $LASTEXITCODE); OpenSSL will build with no-asm"
            $global:LASTEXITCODE = 0
          }
          $nasmDir = @(
            'C:\Program Files\NASM',
            'C:\Program Files (x86)\NASM'
          ) | Where-Object { Test-Path "$_\nasm.exe" } | Select-Object -First 1
          if ($nasmDir) {
            $nasmDir >> $env:GITHUB_PATH
          }

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Release Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          ARCHIVE_NAME="skat-os-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/
          chmod +x "dist/${{ matrix.binary_name }}"
          (cd dist && tar -czf "../${ARCHIVE_NAME}" "${{ matrix.binary_name }}")
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
          mkdir -p artifacts
          mv "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" artifacts/
        shell: bash

      - name: Package Release Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $ArchiveName = "skat-os-$Tag-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination dist/
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Path $ArchiveName -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "$ArchiveName.sha256" -Encoding ascii
          New-Item -ItemType Directory -Force -Path artifacts
          Move-Item $ArchiveName, "$ArchiveName.sha256" -Destination artifacts/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated Checksums
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          echo "=== Generated SHA256SUMS ==="
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
