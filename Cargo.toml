[package]
name = "skat-os"
version = "0.1.0"
edition = "2024"
authors = ["Charan <https://github.com/theon199>"]
description = "Lightweight Terminal Document Operating System & Real-Time Multiplayer Runbooks"
license = "MIT OR Apache-2.0"
readme = "README.md"
homepage = "https://github.com/theon199/skat-os"
repository = "https://github.com/theon199/skat-os"
documentation = "https://docs.rs/skat-os"
keywords = ["terminal", "tui", "runbook", "editor", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
hex = "0.4.3"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.11.1"
ssh2 = { version = "0.9.7", features = ["vendored-openssl"] }
tokio = { version = "1.54.1", features = ["full"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
